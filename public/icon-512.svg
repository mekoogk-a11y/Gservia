<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gserviaBg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E1A"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="gserviaGateBlue512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="gserviaGateCyan512" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Surface with Diamond Chamfer Corners -->
  <rect width="512" height="512" rx="118" fill="url(#gserviaBg512)"/>
  <rect x="8" y="8" width="496" height="496" rx="110" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="4"/>
  
  <!-- Outer Digital Gateway Ring -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#1E293B" stroke-width="8"/>
  <path d="M256 80 A176 176 0 0 1 432 256" fill="none" stroke="url(#gserviaGateCyan512)" stroke-width="8" stroke-linecap="round"/>
  <path d="M256 432 A176 176 0 0 1 80 256" fill="none" stroke="url(#gserviaGateBlue512)" stroke-width="8" stroke-linecap="round"/>

  <!-- Center Geometric 'G' Gateway Emblem -->
  <g filter="url(#glow512)">
    <!-- Distinct GServia Geometric Monogram Path -->
    <path d="M 352 165 A 138 138 0 1 0 394 256 L 256 256 L 256 214 L 436 214 A 180 180 0 1 1 384 128 Z" 
          fill="url(#gserviaGateBlue512)"/>
          
    <!-- Core Hub Connection Node -->
    <circle cx="256" cy="256" r="36" fill="#090E1A" stroke="#38BDF8" stroke-width="6"/>
    <circle cx="256" cy="256" r="16" fill="#38BDF8"/>
  </g>

  <!-- 4 Radiant Digital Satellite Sparks -->
  <circle cx="256" cy="64" r="9" fill="#4285F4"/>
  <circle cx="448" cy="256" r="9" fill="#EA4335"/>
  <circle cx="256" cy="448" r="9" fill="#34A853"/>
  <circle cx="64" cy="256" r="9" fill="#FBBC05"/>
</svg>
